# Alembic config -- AI Business Project Assistant
# Target DB: MySQL 8, dedicated schema biz_assistant (see docs/DECISIONS.md D2)
# Script location: <project root>/migrations
#
# Usage (run from project root D:\biz-assistant):
#   .venv/Scripts/alembic.exe revision --autogenerate -m "message"
#   .venv/Scripts/alembic.exe upgrade head
#   .venv/Scripts/alembic.exe current
#
# NOTE: sqlalchemy.url is intentionally left empty -- the real DSN is injected by
# migrations/env.py from the application settings (env vars / .env), so that
# database credentials never land in version control.
# NOTE: this file is kept ASCII-only on purpose: configparser reads it with the
# system locale encoding (GBK on zh-CN Windows) and would otherwise fail.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/backend
version_path_separator = os

# empty on purpose, injected by env.py
sqlalchemy.url =

# timestamp-prefixed filenames keep revisions ordered
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
