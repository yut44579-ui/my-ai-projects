<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI客服 · 人工工作台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --blue:#2563EB; --ink:#16202E; --dim:#6B7A90; --line:#E3E9F1;
          --bg:#F4F6FA; --green:#159A55; --amber:#D98324; --red:#C0392B; }
  body { font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
         background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:11px 20px;
           display:flex; align-items:center; gap:11px; position:sticky; top:0; z-index:10; }
  .logo { width:27px; height:27px; border-radius:8px; color:#fff; font-weight:800; font-size:12px;
          background:linear-gradient(135deg,var(--blue),#38BDF8);
          display:flex; align-items:center; justify-content:center; }
  header h1 { font-size:15px; font-weight:700; }
  header .sub { font-size:12px; color:var(--dim); margin-left:4px; }
  header a { margin-left:auto; font-size:12.5px; color:var(--blue); text-decoration:none; }

  .wrap { display:flex; gap:16px; padding:16px 20px 40px; align-items:flex-start; }

  /* 左：队列 */
  .queue { width:330px; flex:none; background:#fff; border:1px solid var(--line);
           border-radius:12px; overflow:hidden; }
  .queue .qh { padding:12px 15px; border-bottom:1px solid #EEF2F7; font-size:13.5px; font-weight:700;
               display:flex; align-items:center; gap:8px; }
  .queue .qh .cnt { margin-left:auto; background:#FDECEC; color:var(--red); font-size:11px;
                    padding:2px 8px; border-radius:9px; font-weight:700; }
  .qi { padding:12px 15px; border-bottom:1px solid #F3F6FA; cursor:pointer; }
  .qi:hover { background:#FAFCFF; }
  .qi.on { background:#EFF5FF; border-right:2.5px solid var(--blue); }
  .qi .r1 { display:flex; align-items:baseline; gap:7px; }
  .qi .nm { font-size:13px; font-weight:650; }
  .qi .tm { font-size:10.5px; color:#A2AEBD; margin-left:auto; }
  .qi .q { font-size:12px; color:var(--dim); margin-top:3px;
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .qi .tag { display:inline-block; font-size:10px; padding:1px 7px; border-radius:7px;
             font-weight:650; margin-top:5px; }
  .tag.esc { background:#FDECEC; color:var(--red); }
  .tag.draft { background:#FFF4E0; color:var(--amber); }
  .empty { padding:22px 16px; color:var(--dim); font-size:12.5px; text-align:center; }

  /* 右：会话 */
  .main { flex:1; min-width:0; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .mhead { padding:12px 16px; border-bottom:1px solid #E5EAF1; display:flex; align-items:center; gap:10px; }
  .mhead .nm { font-size:14px; font-weight:700; }
  .mhead .st { font-size:11.5px; color:var(--dim); }
  .mhead .rt { margin-left:auto; display:flex; gap:8px; }
  .body2 { display:flex; }
  .chat { flex:1; padding:16px; display:flex; flex-direction:column; gap:11px; min-height:420px; }
  .cm { max-width:78%; font-size:13px; line-height:1.65; border-radius:12px; padding:10px 13px; }
  .cm.u { align-self:flex-end; background:var(--blue); color:#fff; }
  .cm.a { align-self:flex-start; background:#F7F9FC; border:1px solid var(--line); }
  .cm .src { margin-top:6px; padding-top:6px; border-top:1px dashed #E0E6EE;
             font-size:10.5px; color:var(--dim); }

  .side { width:300px; flex:none; border-left:1px solid #E5EAF1; padding:14px 15px; background:#FCFDFF; }
  .side h3 { font-size:12.5px; font-weight:750; margin-bottom:9px; }
  .sbox { background:#fff; border:1px solid var(--line); border-radius:9px;
          padding:10px 12px; margin-bottom:9px; font-size:12px; line-height:1.6; }
  .sbox .bt { font-weight:700; font-size:12px; margin-bottom:4px; }
  .sbox .bd { color:#5A6879; }
  .sbox.warn { background:#FFF8EC; border-color:#F0D5A0; }
  .sbox.warn .bt { color:#8A5E00; }
  .sbox .lk { color:var(--blue); font-size:11px; margin-top:4px; display:block; }

  .reply { padding:14px 16px; border-top:1px solid #E5EAF1; background:#FCFDFF; }
  .reply .rh { font-size:12.5px; font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:7px; }
  .reply .rh .ai { font-size:10.5px; font-weight:600; color:var(--amber);
                   background:#FFF4E0; padding:1px 8px; border-radius:8px; }
  textarea { width:100%; border:1.5px solid var(--line); border-radius:9px; padding:10px 12px;
             font-size:13.5px; font-family:inherit; line-height:1.6; resize:vertical; outline:none; }
  textarea:focus { border-color:var(--blue); }
  .btns { display:flex; gap:8px; margin-top:10px; align-items:center; }
  button { border:none; border-radius:9px; padding:9px 18px; font-size:13.5px; font-weight:650;
           cursor:pointer; font-family:inherit; background:var(--blue); color:#fff; }
  button.ghost { background:#fff; color:var(--dim); border:1.5px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .msg { font-size:12.5px; margin-left:auto; }
  .msg.ok { color:var(--green); } .msg.err { color:var(--red); }
  .hint { font-size:11.5px; color:var(--dim); margin-top:8px; line-height:1.55; }
</style>
</head>
<body>

<header>
  <div class="logo">AI</div>
  <h1>人工工作台</h1>
  <div class="sub">AI 答不了的会落到这里</div>
  <a href="/">← 回控制台</a>
</header>

<div class="wrap">
  <div class="queue">
    <div class="qh">待处理 <span class="cnt" id="qcount">0</span></div>
    <div id="qlist"><div class="empty">加载中…</div></div>
  </div>

  <div class="main">
    <div class="mhead">
      <div><div class="nm" id="who">—</div><div class="st" id="where">—</div></div>
      <div class="rt">
        <button class="ghost" id="takebtn" onclick="take()">接管</button>
      </div>
    </div>
    <div class="body2">
      <div class="chat" id="chat">
        <div class="empty">左边选一条</div>
      </div>
      <div class="side" id="side">
        <h3>AI 已经查到的</h3>
        <div class="empty">选中一条后显示</div>
      </div>
    </div>
    <div class="reply">
      <div class="rh">回复 <span class="ai" id="aitag">AI 草稿，可改</span></div>
      <textarea id="text" rows="4" placeholder="选中一条后，AI 的草稿会出现在这里，你改完直接发。"></textarea>
      <div class="btns">
        <button id="sendbtn" onclick="send()" disabled>发送</button>
        <button class="ghost" onclick="reject()" id="rejbtn" disabled>这条草稿不能用</button>
        <span class="msg" id="msg"></span>
      </div>
      <div class="hint">
        ★ 你改过的内容会进「待验证队列」，过了评测才生效 ——
        不会因为一次随手改动就把之后所有回答带偏。
      </div>
    </div>
  </div>
</div>

<script>

// ★ 子路径部署支持：算出当前部署前缀。
//   本地根路径 → ''；部署在 /demo/kefu/ 下 → '/demo/kefu'。
//   ★ 不这么做的话，界面里所有 /api/... 请求都会打到网站根上 → 404。
window.__BASE__ = new URL('.', location.href).pathname.replace(/\/$/, '');
const API = (p) => window.__BASE__ + p;
const $ = (s) => document.querySelector(s);
const api = async (p, o) => {
  // ★ 前缀加在封装里（调用处传的是路径变量，在调用处替换是匹配不上的）
  const r = await fetch(API(p), o);
  if (!r.ok) throw new Error((await r.text()).slice(0, 300));
  return r.json();
};
const esc = (s) => (s || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const DEC = { draft: ['draft', 'AI 起过草稿'], escalate: ['esc', '直接转人工'] };

let items = [], cur = null;

async function load() {
  const d = await api('/api/handover');
  items = d.items;
  $('#qcount').textContent = d.counts.open;
  $('#qlist').innerHTML = !items.length
    ? '<div class="empty">没有待处理的<br><span style="font-size:11px">AI 能答的都自动回了</span></div>'
    : items.map((x, i) => {
        const [cls, label] = DEC[x.decision] || ['esc', x.decision];
        return `<div class="qi ${cur && cur.id === x.id ? 'on' : ''}" onclick="pick(${i})">
          <div class="r1"><span class="nm">${esc(x.user_id || '访客')}</span>
            <span class="tm">${(x.created_at || '').slice(11, 16)}</span></div>
          <div class="q">${esc(x.question)}</div>
          <span class="tag ${cls}">${label}</span>
        </div>`;
      }).join('');
  if (!cur && items.length) pick(0);
}

function pick(i) {
  cur = items[i];
  $('#who').textContent = cur.user_id || '访客';
  $('#where').textContent = `${cur.platform} · ${(cur.created_at || '').slice(0, 16).replace('T', ' ')}`;
  $('#chat').innerHTML = `
    <div class="cm u">${esc(cur.question)}</div>
    ${cur.ai_answer ? `<div class="cm a">${esc(cur.ai_answer)}
        <div class="src">${cur.decision === "draft"
            ? "AI 写的草稿（它没把握，你改完再发）"
            : "AI 查到的原文（它没作答，供你参考）"}</div></div>` : ""}`;
  const cites = (() => { try { return JSON.parse(cur.citations_json || '[]'); } catch { return []; } })();
  const hits = (() => { try { return JSON.parse(cur.retrieved_json || '[]'); } catch { return []; } })();
  $('#side').innerHTML = `
    <h3>AI 已经查到的</h3>
    <div class="sbox"><div class="bt">为什么没答</div><div class="bd">${esc(cur.reason || '—')}</div></div>
    <div class="sbox"><div class="bt">检索质量</div><div class="bd">${cur.quality ?? '—'}</div></div>
    ${hits.length ? `<div class="sbox"><div class="bt">命中的资料</div>
        <div class="bd">${hits.map((h) => esc(h.doc) + '（' + h.score + '）' + (h.stale ? ' <b style="color:#D98324">内容较旧</b>' : '')).join('<br>')}</div></div>`
      : '<div class="sbox"><div class="bt">命中的资料</div><div class="bd">什么都没查到</div></div>'}
    ${cites.length ? `<div class="sbox"><div class="bt">引用出处</div><div class="bd">${cites.map(esc).join('、')}</div></div>` : ''}
    <div class="sbox"><div class="bt">这个用户问过的</div><div class="bd" id="hist">—</div></div>`;
  // ★ 只有 draft 的才预填进输入框（那是 AI 真写的句子，改一改就能发）。
  //   escalate 的 ai_answer 是**资料原文**，预填进去客服很可能看都不看就发出去，
  //   而原文里可能带内部措辞（比如"财务部应于…"）。所以那种情况留空，让他自己写。
  const isDraft = cur.decision === 'draft' && !!cur.ai_answer;
  $('#text').value = isDraft ? cur.ai_answer : '';
  $('#aitag').textContent = isDraft ? 'AI 草稿，可改' : 'AI 没写草稿，你自己写';
  $('#sendbtn').disabled = false;
  $('#rejbtn').disabled = !isDraft;
  $('#msg').textContent = '';
  load() === undefined;
  // 高亮当前项（load 会重绘列表）
  document.querySelectorAll('.qi').forEach((el, k) => el.classList.toggle('on', items[k] && cur && items[k].id === cur.id));
}

async function take() {
  if (!cur) return;
  await api(`/api/handover/${cur.id}/take`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ by: '我' }),
  });
  $('#msg').className = 'msg ok';
  $('#msg').textContent = '已接管，AI 不会再自动回这条';
}

async function send() {
  if (!cur) return;
  const text = $('#text').value.trim();
  if (!text) return;
  $('#sendbtn').disabled = true;
  try {
    const r = await api(`/api/handover/${cur.id}/reply`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, by: '我', send: true }),
    });
    $('#msg').className = 'msg ' + (r.ok ? 'ok' : 'err');
    $('#msg').textContent = r.ok ? ('已发出。' + (r.learned || '')) : ('发送失败：' + (r.error || ''));
    cur = null;
    await load();
  } catch (e) {
    $('#msg').className = 'msg err';
    $('#msg').textContent = '出错：' + e.message;
  } finally { $('#sendbtn').disabled = false; }
}

async function reject() {
  if (!cur) return;
  await api(`/api/handover/${cur.id}/reject?why=wrong_fact`, { method: 'POST' });
  $('#msg').className = 'msg ok';
  $('#msg').textContent = '已记为负反馈，AI 会知道这类答法不对';
  cur = null;
  await load();
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
